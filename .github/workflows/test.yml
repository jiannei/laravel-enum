name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    tests:
        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
                laravel: [ 9.*, 10.*, 11.*, 12.*, 13.* ]
                dependency-version: [ prefer-stable ]
                include:
                    - laravel: 9.*
                      testbench: 7.*
                    - laravel: 10.*
                      testbench: 8.*
                    - laravel: 11.*
                      testbench: 9.*
                    - laravel: 12.*
                      testbench: 10.*
                    - laravel: 13.*
                      testbench: 11.*
                exclude:
                    # Laravel 11+ requires PHP 8.2+
                    - php: 8.1
                      laravel: 11.*
                    - php: 8.1
                      laravel: 12.*
                    - php: 8.1
                      laravel: 13.*
                    # Laravel 13 requires PHP 8.3+
                    - php: 8.2
                      laravel: 13.*
                    # Laravel 9/10 do not support PHP 8.3+
                    - php: 8.3
                      laravel: 9.*
                    - php: 8.4
                      laravel: 9.*
                    - php: 8.4
                      laravel: 10.*
                    # PHP 8.5 is only supported by Laravel 12/13
                    - php: 8.5
                      laravel: 9.*
                    - php: 8.5
                      laravel: 10.*
                    - php: 8.5
                      laravel: 11.*

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
                      ${{ runner.os }}-php-${{ matrix.php }}-
                      ${{ runner.os }}-

            - name: Install dependencies - L${{ matrix.laravel }}
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  if [ "${{ matrix.laravel }}" = "9.*" ]; then
                      # Testbench 7 is locked to PHPUnit 9; Pest 2+ requires PHPUnit 10+.
                      composer require "pestphp/pest:^1.22" --no-interaction --no-update
                  fi
                  # Laravel 9-11 are EOL and every release carries known advisories.
                  # The matrix still exercises them; the audit job keeps the
                  # security signal for the current stack.
                  composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-blocking

            - name: Execute tests
              run: vendor/bin/pest

    lowest-dependencies:
        name: Lowest dependencies - P${{ matrix.php }} - L${{ matrix.laravel }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: 8.1
                      laravel: 9.*
                      testbench: 7.*
                    - php: 8.3
                      laravel: 13.*
                      testbench: 11.*

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Install lowest dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  if [ "${{ matrix.laravel }}" = "9.*" ]; then
                      # Testbench 7 is locked to PHPUnit 9; Pest 2+ requires PHPUnit 10+.
                      composer require "pestphp/pest:^1.22" --no-interaction --no-update
                  fi
                  composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-blocking

            - name: Execute tests
              run: vendor/bin/pest

    code-style:
        name: Code Style (Laravel Pint)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction

            - name: Run Laravel Pint
              run: vendor/bin/pint --test

    static-analysis:
        name: Static Analysis (Larastan)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction

            - name: Run Larastan
              run: vendor/bin/phpstan analyse --memory-limit=2G

    composer-validate:
        name: Composer Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Audit dependencies
              run: |
                  composer update --no-install --no-interaction
                  # No vendor tree is installed in this job.
                  composer audit --locked --no-interaction

    lumen:
        name: P${{ matrix.php }} - Lumen ${{ matrix.lumen }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - lumen: 10.*
                      php: 8.1
                    - lumen: 11.*
                      php: 8.4

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: tests-lumen/vendor
                  key: ${{ runner.os }}-php-${{ matrix.php }}-lumen-${{ matrix.lumen }}-${{ hashFiles('tests-lumen/composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php }}-lumen-
                      ${{ runner.os }}-php-${{ matrix.php }}-

            - name: Install dependencies
              working-directory: tests-lumen
              run: |
                  composer require "laravel/lumen-framework:${{ matrix.lumen }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction

            - name: Execute Lumen smoke tests
              working-directory: tests-lumen
              run: vendor/bin/phpunit
